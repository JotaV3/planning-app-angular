<header class="header">
    <h1>Card Registration</h1>

    <div class="user-area">
        <span class="user-name">Hello, User</span>
        <i class="fa-solid fa-circle-user"></i>
    </div>
</header>

<main class="content">
    <div class="card">
        <h2>New Card</h2>

        <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="name">Card Name: *</label>
                <input formControlName="name" type="text" id="name" name="name" placeholder="Ex: My Credit Card" required>
            </div>

            <div class="form-group">
                <label for="brand">Brand: *</label>
                <select formControlName="brand" id="brand" name="brand" required>
                    <option value="">Select a brand</option>
                    <option value="VISA">Visa</option>
                    <option value="MASTERCARD">Mastercard</option>
                    <option value="AMERICAN_EXPRESS">American Express</option>
                    <option value="DINERS">Diners</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Register</button>
                <button type="reset" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>
</main>
